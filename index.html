<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Probability – Self Learning | நிகழ்தகவு – சுய கற்றல்</title>
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#1f2433;--mut:#6b6f7d;--line:#e3dccb;--pri:#2b3a8c;--pri2:#e8ebfa;--gold:#e9b530}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
html{font-size:clamp(15px,1.1vw + 11px,21px)}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,"Noto Sans Tamil","Nirmala UI",Latha,sans-serif;line-height:1.5;display:flex;flex-direction:column;height:100vh;height:100dvh}
.credit{flex:none;display:flex;align-items:center;gap:.6rem;background:#1c2560;color:#fff;padding:.4rem .8rem;font-size:.78rem}
.credit span{flex:1;min-width:0}
.credit button{flex:none;border:1px solid #fff8;background:none;color:#fff;border-radius:99px;padding:.25rem .8rem;font:inherit;font-weight:600;cursor:pointer;display:none}
.lesson .credit button{display:inline-block}
#home{flex:1;overflow:auto}
#frame{flex:1;border:0;width:100%;display:none;background:var(--bg)}
.lesson #home{display:none}.lesson #frame{display:block}
.wrap{max-width:860px;margin:auto;padding:1rem .9rem 3rem}
.hd{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.hd h1{flex:1;font-size:1.35rem;margin:.4rem 0}
.lang{display:flex;border:1px solid var(--pri);border-radius:99px;overflow:hidden}
.lang button{background:none;border:0;color:var(--pri);padding:.3rem .8rem;font:inherit;font-size:.85rem;cursor:pointer}
.lang button.on{background:var(--pri);color:#fff;font-weight:700}
.lead{color:var(--mut);margin:.2rem 0 1rem}
.tiles{display:grid;gap:.9rem}
@media(min-width:700px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{display:flex;flex-direction:column;gap:.4rem;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1rem;font:inherit;color:inherit;cursor:pointer;box-shadow:0 1px 3px #0001;transition:transform .1s}
.tile:active{transform:scale(.98)}
.tile .ic{font-size:2.2rem;line-height:1}
.tile h2{margin:0;font-size:1.15rem}
.tile p{margin:0;color:var(--mut);font-size:.9rem}
.tile .go{margin-top:auto;align-self:flex-start;background:var(--pri);color:#fff;border-radius:10px;padding:.45rem 1rem;font-weight:600}
.wmh{text-align:center;font-size:.72rem;color:#a39c8c;letter-spacing:.04em;margin-top:2rem;user-select:none}
</style>

function dec(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new TextDecoder('utf-8').decode(u);}
var TILES=[
 {k:'coin',ic:'🪙',t:['Coin tossing','நாணயம் சுண்டுதல்'],d:['Two and three coins, key words, the 2ⁿ rule and the addition theorem.','இரண்டு, மூன்று நாணயங்கள், முக்கிய சொற்கள், 2ⁿ விதி, கூட்டல் தேற்றம்.']},
 {k:'dice',ic:'🎲',t:['Dice','பகடை'],d:['One and two dice, ordered pairs, the 6ⁿ rule, special dice and a die with a coin.','ஒன்று, இரண்டு பகடைகள், வரிசைச் சோடிகள், 6ⁿ விதி, சிறப்புப் பகடைகள், பகடையும் நாணயமும்.']},
 {k:'ball',ic:'🔴',t:['Balls in a bag','பையில் பந்துகள்'],d:['Drawing one ball, not / or / neither … nor, two balls at a time and unknown balls.','ஒரு பந்தை எடுத்தல், அல்ல / அல்லது / … உம் அல்ல, ஒரே நேரத்தில் இரண்டு பந்துகள், தெரியாத பந்துகள்.']}];
function started(k){try{return !!localStorage.getItem(KEYS[k]);}catch(e){return false;}}
function renderHome(){
 document.documentElement.lang=lang;
 document.getElementById('credit').textContent=T(['Created by J. Senthil selvan, BT Maths, GBHSS Thirumayam, Pudukkottai District','உருவாக்கம்: J. Senthil selvan, பட்டதாரி ஆசிரியர் (கணிதம்), அரசு ஆண்கள் மேல்நிலைப் பள்ளி, திருமயம், புதுக்கோட்டை மாவட்டம்']);
 document.getElementById('homeBtn').textContent='🏠 '+T(['Home','முகப்பு']);
 document.getElementById('h1').textContent=T(['Probability – Self Learning','நிகழ்தகவு – சுய கற்றல்']);
 document.getElementById('lead').textContent=T(['10th Maths, Chapter 8. Choose a lesson. Your progress in each lesson is saved on this device.','10ஆம் வகுப்பு கணிதம், அலகு 8. ஒரு பாடத்தைத் தேர்ந்தெடுக்கவும். ஒவ்வொரு பாடத்திலும் உங்கள் முன்னேற்றம் இச்சாதனத்தில் சேமிக்கப்படும்.']);
 [].forEach.call(document.querySelectorAll('.lang button'),function(b){b.className=b.getAttribute('data-v')===lang?'on':'';});
 document.getElementById('tiles').innerHTML=TILES.map(function(t){return '<button class="tile" onclick="openL(\''+t.k+'\')"><span class="ic">'+t.ic+'</span><h2>'+T(t.t)+'</h2><p>'+T(t.d)+'</p><span class="go">'+(started(t.k)?T(['Continue →','தொடர்க →']):T(['Start →','தொடங்கு →']))+'</span></button>';}).join('');}
function setLang(v){lang=v;try{localStorage.setItem('prob_lang',v);}catch(e){}renderHome();}
function openL(k){cur=k;var f=document.getElementById('frame');
 f.onload=function(){try{var w=f.contentWindow;if(w.S&&w.render){w.S.lang=lang;w.render();}}catch(e){}};
 f.srcdoc=dec(L[k]).replace('</style>','</style><style>'+document.getElementById('fontcss').textContent+'</style>');document.body.className='lesson';
 try{history.pushState({l:k},'');}catch(e){}}
function goHome(fromPop){var f=document.getElementById('frame');try{var w=f.contentWindow;if(w&&w.S&&w.S.lang)setLang(w.S.lang);}catch(e){}
 document.body.className='';f.srcdoc='';cur=null;renderHome();
 if(!fromPop){try{history.back();}catch(e){}}}
window.addEventListener('popstate',function(){if(cur)goHome(true);});
renderHome();
</script>
</body>
</html>
